# Build the Windows camera-node installer (SparrowMapCameraSetup.exe) with Inno
# Setup and attach it to the release. Runs on a version tag (v*) or on demand.
name: build-node-installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the .exe to the release

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        run: iscc desktop\sparrowmap-node.iss
        # Inno writes to Output\ next to the .iss by default.
        working-directory: ${{ github.workspace }}

      - name: Locate the built exe
        id: find
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter SparrowMapCameraSetup.exe | Select-Object -First 1
          if (-not $exe) { throw "installer not found" }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      # 🚨 PUBLISH A CHECKSUM WITH THE BINARY, EVERY TIME.
      #
      # Asked on Hacker News: "Are the .exe ... part of a open source repo I can
      # verify with a hash? Otherwise I am not going to trust it." The repo was
      # public and the build was reproducible from it, but no checksum was ever
      # published - so there was nothing to verify a download AGAINST, and the
      # honest answer was that the gap was real.
      #
      # ⚠️ IT HAS TO BE GENERATED HERE, NOT PUBLISHED BY HAND. A hash somebody
      # remembers to compute after the fact is a hash that is eventually wrong
      # or missing, and a WRONG checksum is worse than none: it teaches people
      # the check is noise and to skip it. This runs on the exact bytes that
      # are about to be uploaded, in the same job, seconds before the upload.
      - name: Checksum the installer
        id: sums
        shell: pwsh
        run: |
          $exe = "${{ steps.find.outputs.path }}"
          $h = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          $name = Split-Path $exe -Leaf
          # sha256sum format, so `sha256sum -c` works on it unmodified.
          "$h  $name" | Out-File -Encoding ascii "$exe.sha256"
          "sha=$h" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256 $h  $name"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SparrowMapCameraSetup
          path: |
            ${{ steps.find.outputs.path }}
            ${{ steps.find.outputs.path }}.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The .sha256 rides with the binary so a release can never ship one
          # without the other.
          files: |
            ${{ steps.find.outputs.path }}
            ${{ steps.find.outputs.path }}.sha256
          body: |
            SHA-256 `${{ steps.sums.outputs.sha }}`

            Verify before running:
            `Get-FileHash -Algorithm SHA256 SparrowMapCameraSetup.exe`
            The same hashes are published at https://sparrowmap.com/checksums
            — a different host from the download, so an attacker would have to
            compromise both.
          append_body: true
