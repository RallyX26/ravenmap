<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SparrowMap · Review</title>
<style>
  :root{
    --bg:#0d1219; --panel:#141b25; --panel2:#1b2432; --line:#25303f;
    --ink:#e8eef6; --dim:#8a97a8; --accent:#3b82f6; --accent2:#2563eb;
    --cop:#22c55e; --cop2:#16a34a; --not:#ef4444; --not2:#dc2626; --skip:#64748b;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .hidden{display:none!important}

  /* ---- header ---- */
  header{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:0; z-index:5;
  }
  .brand{display:flex; align-items:center; gap:8px; font-weight:700; letter-spacing:.2px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .who{font-size:12px;color:var(--dim);font-family:var(--mono)}
  .grow{flex:1}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2)}
  .seg button{
    appearance:none;border:0;background:transparent;color:var(--dim);
    font:inherit;font-size:13px;padding:7px 12px;cursor:pointer
  }
  .seg button.on{background:var(--accent);color:#fff;font-weight:600}
  .count{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
  .link{color:var(--dim);font-size:12px;text-decoration:none;cursor:pointer}
  .link:hover{color:var(--ink)}

  /* ---- deck ---- */
  main{height:calc(100% - 53px);display:flex;flex-direction:column}
  .stage{
    flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    padding:14px;position:relative;
  }
  .card{
    width:100%;max-width:640px;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 10px 30px rgba(0,0,0,.35);max-height:100%;
  }
  .photo{
    position:relative;background:#000;flex:1;min-height:0;
    display:flex;align-items:center;justify-content:center;
  }
  .photo img{max-width:100%;max-height:100%;display:block;object-fit:contain}
  .noimg{color:var(--dim);font-size:13px;font-family:var(--mono);padding:40px}
  .meta{
    display:flex;align-items:center;gap:10px;padding:12px 14px;
    border-top:1px solid var(--line);background:var(--panel2)
  }
  .node{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip{
    font-family:var(--mono);font-size:11px;color:var(--dim);
    border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap
  }
  .chip b{color:var(--ink);font-weight:600}
  .ago{font-family:var(--mono);font-size:12px;color:var(--dim);margin-left:auto;white-space:nowrap}

  /* ---- actions ---- */
  .actions{display:flex;gap:10px;padding:12px 14px 16px;max-width:640px;width:100%;margin:0 auto}
  .btn{
    flex:1;appearance:none;border:0;border-radius:14px;cursor:pointer;
    font:inherit;font-weight:700;font-size:16px;padding:16px 10px;color:#fff;
    display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.1;
    transition:transform .04s ease, filter .12s ease; touch-action:manipulation; user-select:none;
  }
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn small{font-weight:500;font-size:11px;opacity:.8;font-family:var(--mono)}
  .btn.cop{background:linear-gradient(180deg,var(--cop),var(--cop2))}
  .btn.not{background:linear-gradient(180deg,var(--not),var(--not2))}
  .btn.skip{background:var(--panel2);color:var(--ink);border:1px solid var(--line);flex:0 0 88px}
  .btn.skip small{color:var(--dim)}
  .undo{
    display:block;margin:0 auto 10px;background:transparent;border:0;color:var(--dim);
    font:inherit;font-size:12px;cursor:pointer;font-family:var(--mono)
  }
  .undo:hover{color:var(--ink)}
  .undo:disabled{opacity:.35;cursor:default}
  .session{text-align:center;color:var(--dim);font-size:11px;font-family:var(--mono);padding-bottom:8px}

  /* ---- empty / all-clear ---- */
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  .center h2{margin:0;font-size:20px}
  .center p{margin:0;color:var(--dim);font-size:14px;max-width:320px}
  .primary{
    appearance:none;border:0;border-radius:12px;background:var(--accent);color:#fff;
    font:inherit;font-weight:600;font-size:15px;padding:12px 22px;cursor:pointer
  }
  .primary:hover{background:var(--accent2)}

  /* ---- login ---- */
  .login-wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .login{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
  .login .brand{justify-content:center;font-size:18px;margin-bottom:6px}
  .login p{color:var(--dim);font-size:13px;text-align:center;margin:0 0 18px}
  .login input{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);font:inherit;font-size:15px;padding:12px 13px;margin-bottom:12px;font-family:var(--mono)
  }
  .login input:focus{outline:0;border-color:var(--accent)}
  .login .primary{width:100%}
  .err{color:var(--not);font-size:13px;text-align:center;margin-top:12px;min-height:16px}

  /* ---- toast ---- */
  #toasts{position:fixed;left:0;right:0;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:20;pointer-events:none}
  .toast{
    background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    font-size:13px;padding:9px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.4);
    font-family:var(--mono);animation:pop .18s ease
  }
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  @media (max-width:520px){
    .btn{font-size:15px;padding:15px 8px}
    .card{border-radius:14px}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="view-login" class="login-wrap hidden">
  <div class="login">
    <div class="brand"><span class="dot"></span> SparrowMap Review</div>
    <p>Paste the review token you were given.</p>
    <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="review token">
    <button class="primary" id="signin">Sign in</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="view-app" class="hidden" style="height:100%;display:flex;flex-direction:column">
  <header>
    <span class="brand"><span class="dot"></span> Review</span>
    <span class="who" id="who"></span>
    <span class="grow"></span>
    <div class="seg" id="seg">
      <button data-scope="pool" class="on">Pool</button>
      <button data-scope="mine">My cameras</button>
    </div>
    <span class="count" id="count"></span>
    <a class="link" id="logout">sign out</a>
  </header>

  <main>
    <!-- deck -->
    <div id="deck" style="flex:1;min-height:0;display:flex;flex-direction:column">
      <div class="stage">
        <div class="card">
          <div class="photo" id="photo"><img id="crop" alt="vehicle crop"></div>
          <div class="meta">
            <span class="node" id="node"></span>
            <span class="chip" id="score"></span>
            <span class="ago" id="ago"></span>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn not" id="b-not">🚗 Not a cop <small>N / ←</small></button>
        <button class="btn skip" id="b-skip">⏭ Skip <small>Space</small></button>
        <button class="btn cop" id="b-cop">🚔 Cop <small>C / →</small></button>
      </div>
      <button class="undo" id="undo" disabled>↩ undo last</button>
      <div class="session" id="session">reviewed 0 this session</div>
    </div>

    <!-- all clear -->
    <div id="empty" class="center hidden">
      <h2>All clear</h2>
      <p id="empty-msg">Nothing waiting for review right now.</p>
      <button class="primary" id="refresh">Refresh</button>
    </div>
  </main>
</div>

<div id="toasts"></div>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var me = null;
  var scope = "pool";
  var items = [];         // pending queue
  var cursor = 0;
  var reviewed = 0;
  var undoStack = [];     // {item, verdict, atCount}
  var loading = false;
  var idleTimer = null;

  // ---- tiny helpers ----------------------------------------------------
  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers);
    if(opts.body && typeof opts.body !== "string"){
      opts.body = JSON.stringify(opts.body);
      opts.headers["Content-Type"] = "application/json";
    }
    opts.credentials = "same-origin";
    return fetch(path, opts);
  }
  function toast(msg){
    var t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    $("#toasts").appendChild(t);
    setTimeout(function(){ t.style.opacity = "0"; t.style.transition="opacity .3s"; }, 2200);
    setTimeout(function(){ t.remove(); }, 2600);
  }
  function ago(ts){
    if(!ts) return "";
    var s = Math.max(0, Date.now()/1000 - ts);
    if(s < 60) return Math.floor(s)+"s ago";
    if(s < 3600) return Math.floor(s/60)+"m ago";
    if(s < 86400) return Math.floor(s/3600)+"h ago";
    return Math.floor(s/86400)+"d ago";
  }
  function show(view){
    $("#view-login").classList.toggle("hidden", view!=="login");
    $("#view-app").classList.toggle("hidden", view!=="app");
  }

  // ---- image degrade (CSP-safe, capture phase) -------------------------
  var imgBroken = false;
  document.addEventListener("error", function(e){
    if(e.target && e.target.id === "crop"){
      imgBroken = true;
      var p = $("#photo");
      if(!p.querySelector(".noimg")){
        var d = document.createElement("div");
        d.className = "noimg"; d.textContent = "no image for this sighting";
        p.appendChild(d);
      }
      $("#crop").style.visibility = "hidden";
    }
  }, true);

  // ---- session bootstrap ----------------------------------------------
  function boot(){
    api("/api/rv/me").then(function(r){
      if(r.status === 401){ show("login"); $("#token").focus(); return; }
      return r.json().then(function(d){
        me = d;
        $("#who").textContent = d.label ? ("· " + d.label) : "";
        // default view: own-scoped reviewers start on their cameras
        if(d.scope === "own"){ scope = "mine"; setSeg("mine"); }
        show("app");
        loadQueue(true);
      });
    }).catch(function(){ show("login"); });
  }

  // ---- login -----------------------------------------------------------
  function doLogin(){
    var tok = $("#token").value.trim();
    if(!tok) return;
    $("#login-err").textContent = "";
    $("#signin").disabled = true;
    api("/api/rv/login", {method:"POST", body:{token:tok}}).then(function(r){
      if(r.ok){ location.reload(); return; }
      $("#signin").disabled = false;
      $("#login-err").textContent = "That token was not accepted.";
    }).catch(function(){
      $("#signin").disabled = false;
      $("#login-err").textContent = "Network error — try again.";
    });
  }

  // ---- queue -----------------------------------------------------------
  function setSeg(s){
    var btns = document.querySelectorAll("#seg button");
    for(var i=0;i<btns.length;i++){ btns[i].classList.toggle("on", btns[i].getAttribute("data-scope")===s); }
  }
  function loadQueue(reset){
    if(loading) return;
    loading = true;
    api("/api/rv/queue?scope="+encodeURIComponent(scope)+"&limit=50").then(function(r){
      if(r.status === 401){ show("login"); return; }
      return r.json();
    }).then(function(d){
      loading = false;
      if(!d) return;
      if(reset){ items = d.items||[]; cursor = 0; }
      else { items = items.concat(d.items||[]); }
      render();
    }).catch(function(){ loading = false; });
  }

  function preload(from){
    for(var i=from;i<from+3 && i<items.length;i++){
      if(items[i] && items[i].crop && !items[i]._pre){
        var im = new Image(); im.src = items[i].crop; items[i]._pre = im;
      }
    }
  }

  function updateCounts(){
    var left = Math.max(0, items.length - cursor);
    $("#count").textContent = left + " left";
    $("#session").textContent = "reviewed " + reviewed + " this session";
    $("#undo").disabled = undoStack.length === 0;
  }

  function render(){
    clearTimeout(idleTimer);
    updateCounts();
    if(cursor >= items.length){
      // exhausted — try to pull more, else show all-clear
      if(!loading){
        api("/api/rv/queue?scope="+encodeURIComponent(scope)+"&limit=50").then(function(r){
          return r.status===401 ? null : r.json();
        }).then(function(d){
          if(d && d.items && d.items.length){ items = items.concat(d.items); render(); }
          else showEmpty();
        }).catch(showEmpty);
      } else { showEmpty(); }
      return;
    }
    $("#deck").classList.remove("hidden");
    $("#empty").classList.add("hidden");
    var it = items[cursor];
    imgBroken = false;
    var no = $("#photo").querySelector(".noimg"); if(no) no.remove();
    var img = $("#crop");
    img.style.visibility = "visible";
    img.src = it.crop || "";
    $("#node").textContent = it.node_name || it.node_id || "a camera";
    $("#ago").textContent = ago(it.ts);
    if(it.score == null){ $("#score").classList.add("hidden"); }
    else { $("#score").classList.remove("hidden"); $("#score").innerHTML = "score <b>"+Number(it.score).toFixed(2)+"</b>"; }
    preload(cursor+1);
  }

  function showEmpty(){
    $("#deck").classList.add("hidden");
    $("#empty").classList.remove("hidden");
    $("#empty-msg").textContent = (scope==="mine")
      ? "Nothing from your cameras is waiting."
      : "Nothing in the pool is waiting for review.";
    updateCounts();
    // gentle auto-refresh only while idle
    idleTimer = setTimeout(function(){ loadQueue(true); }, 30000);
  }

  // ---- verdicts (optimistic) ------------------------------------------
  function sendVerdict(id, verdict, isRetry){
    api("/api/rv/verdict", {method:"POST", body:{id:id, verdict:verdict}}).then(function(r){
      if(r.status === 401){ show("login"); return; }
      if(!r.ok) throw new Error("bad");
    }).catch(function(){
      if(!isRetry){
        setTimeout(function(){ sendVerdict(id, verdict, true); }, 1500);
      } else {
        toast("couldn't save #"+id+" — re-queued");
        // re-queue at the end so it isn't lost
        items.push({id:id, node_name:"(retry)", ts:Date.now()/1000, crop:"/api/rv/crop/"+id});
        updateCounts();
      }
    });
  }

  function act(verdict){
    if(cursor >= items.length) return;
    var it = items[cursor];
    undoStack.push({item:it, verdict:verdict});
    cursor++;
    if(verdict !== "skip") reviewed++;
    render();                      // instant — next crop already preloaded
    sendVerdict(it.id, verdict);   // background
  }

  function undo(){
    if(!undoStack.length) return;
    var last = undoStack.pop();
    if(cursor > 0) cursor--;
    // put it back exactly where we are
    if(items[cursor] !== last.item){ items.splice(cursor, 0, last.item); }
    if(last.verdict !== "skip" && reviewed>0) reviewed--;
    render();
    // best-effort: undo the server-side verdict by parking it back for review
    sendVerdict(last.item.id, "skip");
  }

  // ---- wiring ----------------------------------------------------------
  $("#signin").addEventListener("click", doLogin);
  $("#token").addEventListener("keydown", function(e){ if(e.key==="Enter") doLogin(); });
  $("#b-cop").addEventListener("click", function(){ act("cop"); });
  $("#b-not").addEventListener("click", function(){ act("not"); });
  $("#b-skip").addEventListener("click", function(){ act("skip"); });
  $("#undo").addEventListener("click", undo);
  $("#refresh").addEventListener("click", function(){ loadQueue(true); });
  $("#logout").addEventListener("click", function(){
    api("/api/rv/logout", {method:"POST"}).then(function(){ location.reload(); });
  });
  document.querySelectorAll("#seg button").forEach(function(b){
    b.addEventListener("click", function(){
      var s = b.getAttribute("data-scope");
      if(s === scope) return;
      scope = s; setSeg(s); undoStack = []; loadQueue(true);
    });
  });

  document.addEventListener("keydown", function(e){
    if($("#view-app").classList.contains("hidden")) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if(k==="c" || e.key==="ArrowRight"){ e.preventDefault(); act("cop"); }
    else if(k==="n" || e.key==="ArrowLeft"){ e.preventDefault(); act("not"); }
    else if(k==="s" || e.key===" "){ e.preventDefault(); act("skip"); }
    else if(k==="z"){ e.preventDefault(); undo(); }
  });

  boot();
})();
</script>
</body>
</html>
