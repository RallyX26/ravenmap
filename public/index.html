<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SparrowMap — Watching the watchers</title>
<link rel="icon" href="/static/favicon.ico" sizes="any">
<!-- Installable (Add to Home Screen / desktop Install) uses the SparrowMap mark. -->
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest-map.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SparrowMap">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0E13">
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/static/style.css?v=26">
</head>
<body>

<header class="bar">
  <div class="brand">
    <img src="/static/mark.png" class="mark" alt="" width="28" height="28">
    <div>
      <b>SPARROWMAP</b>
      <span class="tag">Watching the watchers</span>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <form class="plateform" id="plateform" autocomplete="off">
    <input id="plateq" type="search" placeholder="search a plate, town or road"
           maxlength="12" autocapitalize="characters" spellcheck="false"
           aria-label="Search a plate, town or road">
    <button type="submit" aria-label="Search">Find</button>
  </form>

  <nav>
    <a href="/app" class="addcam">Add a camera</a>
    <span class="live" id="live"><i></i>connecting</span>
  </nav>
</header>

<div id="policybar" class="policybar" style="display:none"></div>
<div id="plateresults" class="plateresults" style="display:none"></div>

<main>
  <div id="map"></div>

  <!-- About and Transparency as MODES of the same program rather than separate
       pages. Their markup is fetched from /about and /transparency at runtime,
       so the copy has exactly one home and cannot drift between a page and a
       panel saying slightly different things about what this project does with
       people's data. -->
  <section class="pane" id="pane-about" hidden><div class="paneinner"></div></section>
  <section class="pane" id="pane-transparency" hidden><div class="paneinner"></div></section>

  <aside class="panel" id="panel">
    <div class="filters">
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="police"   data-c="police">Government</button>
      <button class="chip" data-f="gov"      data-c="gov">Gov plate</button>
      <!-- The inverse of "Government": the live road, with the records taken
           off it. Nothing new is revealed - these are the same inert dots that
           are already drawn under "All" - it just stops a handful of red
           records from being the only thing the eye lands on when what you
           want to see is whether the street is actually moving. -->
      <button class="chip" data-f="traffic"  data-c="civilian">Traffic only</button>
      <button class="chip" data-f="none">None</button>
    </div>

    <div class="win">
      <label title="Applies to public sightings. Private traffic is live only and always fades after 45 seconds.">Show</label>
      <select id="window">
        <option value="0" selected>everything</option>
        <!-- 5 minutes is shorter than nothing else here can usefully be: a
             private pass has already faded at 45s, so this window only ever
             narrows the PUBLIC tier, which is what the label says. -->
        <option value="300">last 5 minutes</option>
        <option value="3600">last hour</option>
        <option value="21600">last 6 hours</option>
        <option value="86400">last 24 hours</option>
        <option value="604800">last 7 days</option>
      </select>
      <!-- The toggle shows/hides the WATCHED ROADS. Camera positions are not
           published at all, so there is nothing here to reveal.
           Ships UNCHECKED to match the default in app.js (state.showCams), and
           app.js sets .checked from the stored preference on load. The two must
           agree before anyone sees the control: a box that says "on" over a map
           with no bands reads as broken. -->
      <label class="cams"><input type="checkbox" id="showcams"> watched roads</label>
    </div>

    <div class="trafficbar">
      <span id="traffic">road quiet</span>
    </div>

    <div id="detail" class="detail hidden"></div>

    <div id="windowhint" class="windowhint" style="display:none"></div>

    <div class="listhead">
      <span id="listtitle">Public sightings</span>
      <button id="clearsel" class="ghost hidden">clear</button>
    </div>
    <ul id="list" class="list"></ul>
  </aside>
</main>

<nav class="modes" id="modes">
  <!-- 🚨 ORDER IS DELIBERATE, AND IT IS ABOUT THE PHONE.
       Seven items need 580px and a phone has ~390, so the bar scrolls and only
       the first four or five are visible without a swipe. Whatever is put last
       is, in practice, hidden. So the DOING items lead and the READING ones
       follow: a driver about to set off should not have to swipe a nav bar.
       Nothing here depends on this order - app.js binds the mode buttons by
       their data-m attribute, not by position. -->
  <button data-m="map" class="on"><span class="ic">&#128506;</span>Map</button>
  <!-- 🚗 DRIVING MODE HAD NO WAY IN FROM THE MAP. It is the feature people
       actually use in the car - it warns about patrols ahead and asks about the
       ones your own camera catches - and the only route to it was typing /drive.
       Same failure as the review queue: a page nobody can find is a page nobody
       uses, however good it is. -->
  <a href="/drive" class="modelink"><span class="ic">&#128663;</span>Driving</a>
  <a href="/app" class="modelink"><span class="ic">&#128247;</span>Add a camera</a>
  <!-- 🚨 THE FRONT DOOR NEVER MENTIONED REVIEW, SO IN PRACTICE THERE WAS NO
       WAY IN. The whole map depends on people confirming crops, and the only
       pointer that ever existed was a banner shown once on /app just after a
       token was minted - close that tab and the queue was unreachable except
       by typing the URL. A queue nobody can find is a queue nobody works. -->
  <a href="/rv" class="modelink"><span class="ic">&#9989;</span>Review</a>
  <button data-m="about"><span class="ic">&#9432;</span>About</button>
  <button data-m="transparency"><span class="ic">&#128065;</span>Transparency</button>
  <!-- Status is last on purpose, and it is the one item that loses nothing by
       it: people reach it from a LINK someone sent them after claiming the site
       is down, not by browsing for it. -->
  <a href="/status" class="modelink"><span class="ic">&#128246;</span>Status</a>
</nav>

<div class="legend">
  <span><i class="dot police"></i>government vehicle</span>
  <span><i class="dot civilian"></i>private traffic (fades, never stored readable)</span>
  <span><i class="dot cam"></i>camera</span>
  <span><i class="dash"></i>road watched</span>
</div>

<script src="/vendor/leaflet.js"></script>
<script src="/static/transparency.js?v=18"></script>
<script src="/static/app.js?v=38"></script>
<script src="/static/refresh.js?v=18"></script>
<!-- What changed, once, only to the people it applies to. Most entries are
     audience:'owner', so a visitor reading the map is never interrupted. -->
<script src="/static/updates.js?v=2"></script>
</body>
</html>
