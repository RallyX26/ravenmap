<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SparrowMap — Watching the watchers</title>
<link rel="icon" href="/static/favicon.ico" sizes="any">
<!-- Installable (Add to Home Screen / desktop Install) uses the SparrowMap mark. -->
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest-map.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SparrowMap">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0E13">
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/static/style.css?v=27">
</head>
<body>

<header class="bar">
  <div class="brand">
    <img src="/static/mark.png" class="mark" alt="" width="28" height="28">
    <div>
      <b>SPARROWMAP</b>
      <span class="tag">Watching the watchers</span>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <form class="plateform" id="plateform" autocomplete="off">
    <input id="plateq" type="search" placeholder="search a plate, town or road"
           maxlength="12" autocapitalize="characters" spellcheck="false"
           aria-label="Search a plate, town or road">
    <button type="submit" aria-label="Search">Find</button>
  </form>

  <nav>
    <a href="/app" class="addcam">Add a camera</a>
    <span class="live" id="live"><i></i>connecting</span>
  </nav>
</header>

<div id="policybar" class="policybar" style="display:none"></div>
<div id="plateresults" class="plateresults" style="display:none"></div>

<main>
  <div id="map"></div>

  <!-- About and Transparency as MODES of the same program rather than separate
       pages. Their markup is fetched from /about and /transparency at runtime,
       so the copy has exactly one home and cannot drift between a page and a
       panel saying slightly different things about what this project does with
       people's data. -->
  <section class="pane" id="pane-about" hidden><div class="paneinner"></div></section>
  <section class="pane" id="pane-transparency" hidden><div class="paneinner"></div></section>

  <aside class="panel" id="panel">
    <div class="filters">
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="police"   data-c="police">Government</button>
      <button class="chip" data-f="gov"      data-c="gov">Gov plate</button>
      <!-- The inverse of "Government": the live road, with the records taken
           off it. Nothing new is revealed - these are the same inert dots that
           are already drawn under "All" - it just stops a handful of red
           records from being the only thing the eye lands on when what you
           want to see is whether the street is actually moving. -->
      <button class="chip" data-f="traffic"  data-c="civilian">Traffic only</button>
      <button class="chip" data-f="none">None</button>
    </div>

    <div class="win">
      <!-- The word "Show" was pure decoration - the dropdown says "everything"
           / "last hour" and reads fine alone - and it was taking room the
           checkboxes beside it needed, cutting one off on a narrow panel. The
           tooltip it carried moves onto the control it was describing. -->
      <select id="window" title="Applies to public sightings. Private traffic is live only and always fades after 45 seconds.">
        <option value="0" selected>everything</option>
        <!-- 5 minutes is shorter than nothing else here can usefully be: a
             private pass has already faded at 45s, so this window only ever
             narrows the PUBLIC tier, which is what the label says. -->
        <option value="300">last 5 minutes</option>
        <option value="3600">last hour</option>
        <option value="21600">last 6 hours</option>
        <option value="86400">last 24 hours</option>
        <option value="604800">last 7 days</option>
      </select>
      <!-- The toggle shows/hides the WATCHED ROADS. Camera positions are not
           published at all, so there is nothing here to reveal.
           Ships UNCHECKED to match the default in app.js (state.showCams), and
           app.js sets .checked from the stored preference on load. The two must
           agree before anyone sees the control: a box that says "on" over a map
           with no bands reads as broken. -->
      <label class="cams"><input type="checkbox" id="showcams"> watched roads</label>
      <!-- The town badges are useful at a glance and in the way when you are
           reading one street, so they get the same treatment as the watched
           roads: a checkbox, remembered, and OFF is a real answer. -->
      <label class="cams"><input type="checkbox" id="showplaces" checked> town badges</label>
      <!-- Public traffic cameras are a different KIND of coverage from a
           volunteer's window, so they get their own switch rather than being
           folded into "watched roads". Somebody who only wants to see what
           volunteers are contributing can turn them off. -->
      <label class="cams"><input type="checkbox" id="showpubcams" checked> traffic cams</label>
    </div>

    <div class="trafficbar">
      <span id="traffic">road quiet</span>
    </div>

    <div id="detail" class="detail hidden"></div>

    <div id="windowhint" class="windowhint" style="display:none"></div>

    <div class="listhead">
      <span id="listtitle">Public sightings</span>
      <button id="clearsel" class="ghost hidden">clear</button>
    </div>
    <ul id="list" class="list"></ul>
  </aside>
</main>

<!-- The bottom bar is built by /static/sitenav.js, which is the ONE place
     its destinations and styles live. It used to be written out here, and
     every other page either grew its own way home or (the review pool)
     had none at all. SPARROW_NAV_PANES tells it to render About and
     Transparency as in-place panes over the map instead of links, which
     is the only thing this page needs differently. -->

<div class="legend">
  <span><i class="dot police"></i>government vehicle</span>
  <span><i class="dot civilian"></i>private traffic (fades, never stored readable)</span>
  <span><i class="dot cam"></i>camera</span>
  <span><i class="dash"></i>road watched</span>
</div>

<!-- 🌐 BEFORE app.js, so the very first poll is observed. offline.js wraps
     fetch to use the map's existing /api/stats loop as its liveness signal
     rather than adding a heartbeat of its own; loaded after app.js it would
     miss the calls that fail first, which are the ones that matter. -->
<script src="/static/offline.js?v=1"></script>
<script src="/vendor/leaflet.js"></script>
<script src="/static/transparency.js?v=19"></script>
<script>window.SPARROW_NAV_PANES = true;</script>
<script src="/static/sitenav.js?v=18"></script>
<script src="/static/app.js?v=48"></script>
<script src="/static/refresh.js?v=18"></script>
<!-- What changed, once, only to the people it applies to. Most entries are
     audience:'owner', so a visitor reading the map is never interrupted. -->
<script src="/static/updates.js?v=2"></script>
<script src="/static/install.js?v=3"></script>
<!-- 🚨 THE MAP REGISTERS THE WORKER TOO, NOW.
     This lived only in sparrow-app.js, so a visitor who only ever opened the
     map had no service worker at all and the installed app opened to the
     browser's error page with no signal. Registered LAST and after load, so it
     never competes with the map's own first paint for bandwidth.
     The `serviceWorker in navigator` guard matters: it is false on a plain-http
     LAN address, which is how a node is often reached. -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
